<title>Music for Moomin</title>
<style>
  :root { color-scheme: light; --ink: #1d2433; --paper: #fbf8f1; --line: #cfc8b8; --save: #1e3a8a; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 22px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding: 20px 16px 48px; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 34px; line-height: 1.15; margin: 0 0 10px; }
  p.help { margin: 0 0 22px; }
  a.album { display: block; padding: 18px 16px; margin: 0 0 14px; background: #fff; border: 2px solid var(--ink); border-radius: 12px; color: var(--ink); text-decoration: none; }
  a.album { display: flex; align-items: center; gap: 14px; padding: 12px; }
  a.album img { flex: 0 0 auto; width: 96px; height: 96px; border-radius: 6px; object-fit: cover; }
  a.album .words { flex: 1 1 auto; min-width: 0; }
  a.album b { display: block; font-size: 26px; line-height: 1.2; overflow-wrap: anywhere; }
  a.album span { display: block; margin-top: 4px; }
  img.cover { display: block; width: 180px; max-width: 100%; height: auto; border-radius: 8px; margin: 0 0 14px; }
  a.back { display: block; padding: 16px; margin: 0 0 22px; background: var(--ink); color: #fff; border-radius: 12px; text-align: center; font-weight: 700; text-decoration: none; }
  ol { list-style: none; margin: 0 0 22px; padding: 0; }
  li { padding: 16px 0; border-top: 2px solid var(--line); }
  .song { font-weight: 700; font-size: 24px; line-height: 1.2; margin-bottom: 10px; overflow-wrap: anywhere; }
  a.btn-save { display: flex; min-height: 62px; align-items: center; justify-content: center; font-weight: 700; color: #fff; background: var(--save); border-radius: 12px; text-decoration: none; }
  .note { margin-top: 8px; font-size: 20px; }
</style>

function backLink() { return el('a', { className: 'back', href: '#' }, ['← Back to all the music']); }

function showAlbum(ai) {
  var a = ALBUMS[ai];
  document.title = a.title;
  page.textContent = '';
  page.appendChild(backLink());
  page.appendChild(el('img', { className: 'cover', src: COVERS[a.cover], alt: '' }));
  page.appendChild(el('h1', {}, [a.title]));
  page.appendChild(el('p', { className: 'help' }, [a.artist + '. Tap Save to keep a song on your phone. Your phone will show you when it is ready.']));
  var list = el('ol');
  a.songs.forEach(function (s) {
    var note = el('div', { className: 'note' }, wasSaved(s.id) ? ['✓ You tapped Save for this song.'] : []);    var saveBtn = el('a', { className: 'btn-save', href: saveUrl(s.id) }, ['Save']);
    saveBtn.addEventListener('click', function () {
      markSaved(s.id);
      note.textContent = '✓ You tapped Save for this song.';
    });
    list.appendChild(el('li', {}, [el('div', { className: 'song' }, [s.title]), saveBtn, note]));
  });
  page.appendChild(list);
  page.appendChild(backLink());
  window.scrollTo(0, 0);
}

function route() {
  var m = /^#album-(\d+)$/.exec(location.hash);
  var i = m ? parseInt(m[1], 10) - 1 : -1;
  if (i >= 0 && i < ALBUMS.length) { showAlbum(i); } else { showFront(); }
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
